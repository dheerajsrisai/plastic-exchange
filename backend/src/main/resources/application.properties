server.port=8080
spring.application.name=plastic-exchange
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/plasticexchange}
spring.data.mongodb.auto-index-creation=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT (change the secret in production; must be 32+ characters)
app.jwt.secret=${JWT_SECRET:change-this-super-secret-key-for-plastic-exchange-2024}
app.jwt.expiration-ms=86400000

# File uploads
app.upload-dir=${UPLOAD_DIR:uploads}

# AI/ML service
ml.service.url=${ML_URL:http://localhost:8000}
ai.confidence-threshold=${AI_THRESHOLD:0.5}
